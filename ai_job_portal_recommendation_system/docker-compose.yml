version: '3.8'

services:
  hirenova-app:
    build: .
    container_name: hirenova-ai-app
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
    environment:
      - SECRET_KEY=hirenova-prod-secret-change-me
      - JWT_SECRET_KEY=hirenova-jwt-prod-secret-change-me
      - DEBUG=False
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-HireNova AI <no-reply@hirenova.ai>}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
